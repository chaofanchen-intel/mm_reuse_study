# G0 audit variant of vllm_omni/deploy/bagel.yaml (2026-11-25).
# Only change: stage 0 enable_prefix_caching true, so the prefix-cache
# counters can be read. Everything else is the upstream default.
# BAGEL-7B-MoT deploy: CUDA defaults.
# Native vLLM 0.34 stage-0 KV capacity was checked on H100 (80GB).
# Shared-GPU DiT peak memory and A100 operation remain unqualified here.
#
# Stage 0 (Thinker) and Stage 1 (DiT) share a single GPU by default.
# For dual-GPU setups, set stage 1 devices to "1".
#
# Fields omitted from a stage fall back to StageDeployConfig dataclass
# defaults (see vllm_omni/config/stage_config.py).

async_chunk: false

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 3
    # Audit placement: upstream 0.48 of an 80 GB card is 38 GB; on this 47 GB card
    # 0.48 is 22.7 GB, below the 27.45 GiB model load, so KV cache gets 0 bytes.
    gpu_memory_utilization: 0.85
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 52
      detokenize: true
      repetition_penalty: 1.05

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    # Audit placement: stage 1 on the second visible GPU (CUDA_VISIBLE_DEVICES=0,3 -> logical 1).
    # Both stages on one 47 GB card OOM at startup (stage 0 ~22.7 GB + DiT ~29 GB).
    devices: "1"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 52

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector

  rdma_connector:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: ""
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"
