# 本仓库 smoke 用：M* bagel_single_gpu.yaml + gpu_memory_fraction（否则 CUDA 图捕获占满显存，VAE 解码 OOM）
model: "bagel"
max_seq_len: 32768

node_groups:
  - node_names:
      - vit_encoder
    ranks:
      - 0
  
  - node_names:
      - vae_encoder
      - vae_decoder
    ranks:
      - 0
  
  - node_names:
      - LLM
    ranks:
      - 0
gpu_memory_fraction: 0.8
